<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 코디룸 & 캐릭터 성형 커스텀</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
        }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
        }

        /* 왼쪽 메뉴 */
        .panel-left {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 15px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 8px;
        }

        /* 입력 창 */
        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label { font-size: 0.9rem; font-weight: bold; color: #4b5563; }
        select, input[type="number"] {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        .btn-blue {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .msg-box {
            margin-top: 10px;
            padding: 12px;
            background: #eff6ff;
            border-left: 4px solid #4f46e5;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        /* 커스텀 버튼 디자인 */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .btn-opt {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-opt:hover { border-color: #4f46e5; }
        .btn-opt.active { border-color: #ec4899; background: #fdf2f8; font-weight: bold; }

        .picker-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            align-items: center;
        }

        input[type="color"] {
            width: 35px;
            height: 35px;
            border: none;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        /* 오른쪽 캐릭터 배치 */
        .panel-right {
            position: sticky;
            top: 20px;
        }

        .canvas {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="panel-left">
            
            <div class="card">
                <div class="card-title">⛅ 1. 오늘 날씨 세팅</div>
                <div class="row">
                    <div class="group">
                        <label>현재 기온 (°C)</label>
                        <input type="number" id="temp-val" value="18">
                    </div>
                    <div class="group">
                        <label>건강 컨디션</label>
                        <select id="health-val">
                            <option value="normal">건강함 😀</option>
                            <option value="cold">감기 기운 😷</option>
                        </select>
                    </div>
                </div>
                <button class="btn-blue" onclick="runWeatherCody()">날씨 맞춤 코디 자동 입히기 ✨</button>
                <div class="msg-box" id="cody-msg">날씨 버튼을 누르면 추천 의상이 자동 장착됩니다.</div>
            </div>

            <div class="card">
                <div class="card-title">💇‍♀️ 2. 캐릭터 커스터마이징 (얼굴 & 헤어)</div>
                
                <div class="picker-row">
                    <div>
                        <label>피부톤 변경</label><br>
                        <input type="color" id="skin-picker" value="#ffdbac" oninput="changeSkinColor(this.value)">
                    </div>
                    <div>
                        <label>머리카락 색 변경</label><br>
                        <input type="color" id="hair-picker" value="#4a3728" oninput="changeHairGenColor(this.value)">
                    </div>
                </div>

                <label>얼굴형</label>
                <div class="btn-grid" id="menu-face">
                    <div class="btn-opt active" onclick="changeFace('round')">둥근형</div>
                    <div class="btn-opt" onclick="changeFace('vshape')">V라인</div>
                </div>

                <label>헤어 스타일</label>
                <div class="btn-grid" id="menu-hair">
                    <div class="btn-opt active" onclick="changeHair('classic')">단발 헤어</div>
                    <div class="btn-opt" onclick="changeHair('long')">웨이브 롱</div>
                    <div class="btn-opt" onclick="changeHair('short')">보이시 숏컷</div>
                </div>

                <label>눈 모양</label>
                <div class="btn-grid" id="menu-eyes">
                    <div class="btn-opt active" onclick="changeEyes('normal')">둥근 눈</div>
                    <div class="btn-opt" onclick="changeEyes('big')">왕눈이</div>
                    <div class="btn-opt" onclick="changeEyes('line')">무쌍 눈</div>
                </div>

                <label>코 모양</label>
                <div class="btn-grid" id="menu-nose">
                    <div class="btn-opt active" onclick="changeNose('normal')">일반 코</div>
                    <div class="btn-opt" onclick="changeNose('sharp')">오뚝한 코</div>
                </div>

                <label>입 모양</label>
                <div class="btn-grid" id="menu-mouth">
                    <div class="btn-opt active" onclick="changeMouth('normal')">기본 미소</div>
                    <div class="btn-opt" onclick="changeMouth('smile')">활짝 웃음</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">🎨 3. 나만의 옷 색상 커스텀 (수동)</div>
                <div class="picker-row">
                    <div>
                        <label>상의 색상</label><br>
                        <input type="color" id="top-picker" value="#e2e8f0" oninput="changeClothColor('top', this.value)">
                    </div>
                    <div>
                        <label>하의 색상</label><br>
                        <input type="color" id="bottom-picker" value="#4a5568" oninput="changeClothColor('bottom', this.value)">
                    </div>
                </div>
            </div>

        </div>

        <div class="panel-right">
            <div class="canvas">
                <svg viewBox="0 0 200 320" width="100%" height="400px" style="display: block; margin: 0 auto;">
                    
                    <g id="body-group">
                        <rect id="char-neck" x="93" y="100" width="14" height="20" fill="#ffdbac" />
                        <circle id="char-face-round" cx="100" cy="75" r="30" fill="#ffdbac" display="inline" />
                        <path id="char-face-vshape" d="M 70 75 Q 100 115 130 75 A 30 30 0 0 0 70 75 Z" fill="#ffdbac" display="none" />
                        
                        <rect id="char-leg-l" x="85" y="210" width="12" height="70" rx="3" fill="#ffdbac"/>
                        <rect id="char-leg-r" x="103" y="210" width="12" height="70" rx="3" fill="#ffdbac"/>
                        <ellipse cx="85" cy="285" rx="10" ry="5" fill="#222222"/>
                        <ellipse cx="115" cy="285" rx="10" ry="5" fill="#222222"/>
                    </g>

                    <g id="features-group">
                        <g id="char-eyes-normal" display="inline">
                            <circle cx="90" cy="70" r="3" fill="#222"/><circle cx="110" cy="70" r="3" fill="#222"/>
                        </g>
                        <g id="char-eyes-big" display="none">
                            <ellipse cx="88" cy="70" rx="5" ry="6" fill="#fff" stroke="#222" stroke-width="1"/><circle cx="89" cy="70" r="2.5" fill="#222"/>
                            <ellipse cx="112" cy="70" rx="5" ry="6" fill="#fff" stroke="#222" stroke-width="1"/><circle cx="111" cy="70" r="2.5" fill="#222"/>
                        </g>
                        <g id="char-eyes-line" display="none">
                            <line x1="84" y1="70" x2="94" y2="70" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
                            <line x1="106" y1="70" x2="116" y2="70" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
                        </g>
                        
                        <path id="char-nose-normal" d="M 100 74 Q 102 79 100 83" stroke="#cca194" stroke-width="2" fill="none" stroke-linecap="round" display="inline"/>
                        <path id="char-nose-sharp" d="M 100 72 L 103 79 L 100 83" stroke="#8d6e63" stroke-width="2" fill="none" display="none"/>
                        
                        <path id="char-mouth-normal" d="M 96 91 Q 100 95 104 91" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round" display="inline"/>
                        <path id="char-mouth-smile" d="M 94 90 Q 100 98 106 90" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round" display="none"/>
                    </g>

                    <g id="hair-group">
                        <path id="char-hair-classic" d="M 68 72 Q 100 32 132 72 Q 100 48 68 72" fill="#4a3728" display="inline" />
                        <g id="char-hair-long" display="none">
                            <path d="M 70 75 Q 55 110 65 150 Q 75 110 75 75 Z" fill="#4a3728"/>
                            <path d="M 130 75 Q 145 110 135 150 Q 125 110 125 75 Z" fill="#4a3728"/>
                            <path d="M 68 72 Q 100 32 132 72 Q 100 48 68 72" fill="#4a3728" />
                        </g>
                        <path id="char-hair-short" d="M 70 65 Q 100 38 130 65 L 126 76 Q 100 55 74 76 Z" fill="#4a3728" display="none"/>
                    </g>

                    <g id="pants-group">
                        <rect id="cloth-pants" x="80" y="160" width="40" height="70" rx="2" fill="#4a5568" display="inline"/>
                        <rect id="cloth-shorts" x="80" y="160" width="40" height="32" rx="2" fill="#4a5568" display="none"/>
                    </g>

                    <g id="bare-arms" display="none">
                        <rect x="63" y="135" width="12" height="40" rx="5" fill="#ffdbac"/>
                        <rect x="125" y="135" width="12" height="40" rx="5" fill="#ffdbac"/>
                    </g>

                    <g id="top-group">
                        <g id="cloth-longshirt" display="inline">
                            <rect x="75" y="115" width="50" height="55" rx="3" fill="#e2e8f0"/>
                            <rect x="63" y="115" width="12" height="55" rx="5" fill="#e2e8f0"/>
                            <rect x="125" y="115" width="12" height="55" rx="5" fill="#e2e8f0"/>
                        </g>
                        <g id="cloth-tshirt" display="none">
                            <rect x="75" y="115" width="50" height="55" rx="3" fill="#e2e8f0"/>
                            <rect x="63" y="115" width="12" height="22" rx="4" fill="#e2e8f0"/>
                            <rect x="125" y="115" width="12" height="22" rx="4" fill="#e2e8f0"/>
                        </g>
                    </g>

                    <g id="cloth-coat" display="none">
                        <rect x="71" y="113" width="58" height="92" rx="2" fill="#5d4037"/>
                        <rect x="59" y="115" width="15" height="85" rx="4" fill="#5d4037"/>
                        <rect x="126" y="115" width="15" height="85" rx="4" fill="#5d4037"/>
                        <path d="M 100 113 L 84 130 M 100 113 L 116 130" stroke="#ffffff" stroke-width="2"/>
                    </g>

                    <g id="cloth-padding" display="none">
                        <rect x="67" y="110" width="66" height="98" rx="8" fill="#212121"/>
                        <rect x="54" y="114" width="18" height="88" rx="6" fill="#212121"/>
                        <rect x="128" y="114" width="18" height="88" rx="6" fill="#212121"/>
                    </g>
                    
                    <path id="acc-muffler" display="none" d="M 84 96 Q 100 118 116 96 Q 126 122 100 132 Q 74 122 84 96 Z" fill="#ec4899" rx="4"/>
                    <path id="acc-mask" display="none" d="M 76 76 Q 100 100 124 76 Z" fill="#ffffff" stroke="#b0bec5" stroke-width="1"/>

                </svg>
            </div>
            <p style="text-align: center; font-size: 0.85rem; color: #666; font-weight: bold;">아바타 실시간 뷰어</p>
        </div>

    </div>

    <script>
        // ================= [1. 얼굴형 및 이목구비 커스텀 기능 완벽 연동] =================
        function changeFace(style) {
            document.getElementById('char-face-round').setAttribute('display', style === 'round' ? 'inline' : 'none');
            document.getElementById('char-face-vshape').setAttribute('display', style === 'vshape' ? 'inline' : 'none');
            setActiveBtn('menu-face', style === 'round' ? 0 : 1);
        }

        function changeHair(style) {
            document.getElementById('char-hair-classic').setAttribute('display', style === 'classic' ? 'inline' : 'none');
            document.getElementById('char-hair-long').setAttribute('display', style === 'long' ? 'inline' : 'none');
            document.getElementById('char-hair-short').setAttribute('display', style === 'short' ? 'inline' : 'none');
            let idx = style === 'classic' ? 0 : (style === 'long' ? 1 : 2);
            setActiveBtn('menu-hair', idx);
        }

        function changeEyes(style) {
            document.getElementById('char-eyes-normal').setAttribute('display', style === 'normal' ? 'inline' : 'none');
            document.getElementById('char-eyes-big').setAttribute('display', style === 'big' ? 'inline' : 'none');
            document.getElementById('char-eyes-line').setAttribute('display', style === 'line' ? 'inline' : 'none');
            let idx = style === 'normal' ? 0 : (style === 'big' ? 1 : 2);
            setActiveBtn('menu-eyes', idx);
        }

        function changeNose(style) {
            document.getElementById('char-nose-normal').setAttribute('display', style === 'normal' ? 'inline' : 'none');
            document.getElementById('char-nose-sharp').setAttribute('display', style === 'sharp' ? 'inline' : 'none');
            setActiveBtn('menu-nose', style === 'normal' ? 0 : 1);
        }

        function changeMouth(style) {
            document.getElementById('char-mouth-normal').setAttribute('display', style === 'normal' ? 'inline' : 'none');
            document.getElementById('char-mouth-smile').setAttribute('display', style === 'smile' ? 'inline' : 'none');
            setActiveBtn('menu-mouth', style === 'normal' ? 0 : 1);
        }

        // ================= [2. 피부색 & 머리카락 색 변경] =================
        function changeSkinColor(color) {
            document.getElementById('skin-picker').value = color;
            document.getElementById('char-neck').setAttribute('fill', color);
            document.getElementById('char-face-round').setAttribute('fill', color);
            document.getElementById('char-face-vshape').setAttribute('fill', color);
            document.getElementById('char-leg-l').setAttribute('fill', color);
            document.getElementById('char-leg-r').setAttribute('fill', color);
            
            const bareArms = document.getElementById('bare-arms').querySelectorAll('rect');
            bareArms.forEach(rect => rect.setAttribute('fill', color));
        }

        function changeHairGenColor(color) {
            document.getElementById('hair-picker').value = color;
            
            // 모든 헤어 레이어 내부의 조각들을 찾아서 색칠
            document.getElementById('char-hair-classic').setAttribute('fill', color);
            document.getElementById('char-hair-short').setAttribute('fill', color);
            const longParts = document.getElementById('char-hair-long').querySelectorAll('path');
            longParts.forEach(p => p.setAttribute('fill', color));
        }

        // ================= [3. 상의/하의 옷 색상 변경 버그 완전 박멸] =================
        function changeClothColor(type, color) {
            if (type === 'top') {
                document.getElementById('top-picker').value = color;
                // 긴팔과 반팔 그룹 안의 모든 다각형(rect)을 찾아서 주입합니다.
                const topElements = document.getElementById('top-group').querySelectorAll('rect');
                topElements.forEach(el => el.setAttribute('fill', color));
            } else if (type === 'bottom') {
                document.getElementById('bottom-picker').value = color;
                const bottomElements = document.getElementById('pants-group').querySelectorAll('rect');
                bottomElements.forEach(el => el.setAttribute('fill', color));
            }
        }

        // UI 활성화 클래스 조절용 유틸 함수
        function setActiveBtn(menuId, index) {
            const btns = document.getElementById(menuId).querySelectorAll('.btn-opt');
            btns.forEach((b, idx) => {
                if(idx === index) b.classList.add('active');
                else b.classList.remove('active');
            });
        }

        // ================= [4. 날씨 추천 알고리즘] =================
        function runWeatherCody() {
            const temp = parseFloat(document.getElementById('temp-val').value);
            const health = document.getElementById('health-val').value;
            const msgBox = document.getElementById('cody-msg');

            // 옷 가시성 리셋
            document.getElementById('cloth-longshirt').setAttribute('display', 'none');
            document.getElementById('cloth-tshirt').setAttribute('display', 'none');
            document.getElementById('bare-arms').setAttribute('display', 'none');
            document.getElementById('cloth-pants').setAttribute('display', 'none');
            document.getElementById('cloth-shorts').setAttribute('display', 'none');
            document.getElementById('cloth-coat').setAttribute('display', 'none');
            document.getElementById('cloth-padding').setAttribute('display', 'none');
            document.getElementById('acc-muffler').setAttribute('display', 'none');
            document.getElementById('acc-mask').setAttribute('display', 'none');

            let txt = "";
            let tColor = "#e2e8f0";
            let bColor = "#4a5568";

            let feelTemp = temp;
            if(health === 'cold') {
                feelTemp -= 3;
                document.getElementById('acc-mask').setAttribute('display', 'inline');
            }

            if (feelTemp >= 26) {
                txt = "☀️ 더운 날씨: <b>반팔티에 반바지</b> 조합으로 입혀드렸습니다!";
                document.getElementById('cloth-tshirt').setAttribute('display', 'inline');
                document.getElementById('bare-arms').setAttribute('display', 'inline');
                document.getElementById('cloth-shorts').setAttribute('display', 'inline');
                tColor = "#ffffff"; bColor = "#90caf9";
            } 
            else if (feelTemp >= 18 && feelTemp < 26) {
                txt = "🌸 온화한 날씨: 깔끔한 <b>긴팔 셔츠에 기본 긴바지</b> 조합입니다.";
                document.getElementById('cloth-longshirt').setAttribute('display', 'inline');
                document.getElementById('cloth-pants').setAttribute('display', 'inline');
                tColor = "#f48fb1"; bColor = "#37474f";
            } 
            else if (feelTemp >= 8 && feelTemp < 18) {
                txt = "🍁 쌀쌀한 날씨: 환절기 감기 조심! <b>긴팔 위에 도톰한 코트</b>를 입혔습니다.";
                document.getElementById('cloth-longshirt').setAttribute('display', 'inline');
                document.getElementById('cloth-pants').setAttribute('display', 'inline');
                document.getElementById('cloth-coat').setAttribute('display', 'inline');
                tColor = "#ffffff"; bColor = "#263238";
            } 
            else {
                txt = "❄️ 한파 날씨: <b>두꺼운 롱패딩에 긴바지, 목도리</b>로 무장했습니다!";
                document.getElementById('cloth-longshirt').setAttribute('display', 'inline');
                document.getElementById('cloth-pants').setAttribute('display', 'inline');
                document.getElementById('cloth-padding').setAttribute('display', 'inline');
                document.getElementById('acc-muffler').setAttribute('display', 'inline');
                tColor = "#cfd8dc"; bColor = "#1a237e";
            }

            msgBox.innerHTML = txt;
            changeClothColor('top', tColor);
            changeClothColor('bottom', bColor);
        }

        // 로드 시 초기 세팅 무조건 실행
        window.onload = function() {
            changeSkinColor("#ffdbac");
            changeHairGenColor("#4a3728");
            runWeatherCody();
        };
    </script>
</body>
</html>
