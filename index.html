<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>제페토 스타일 아바타 드레스룸</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .box { display: flex; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); gap: 30px; max-width: 900px; width: 100%; }
        .left-menu { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .right-view { width: 300px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 15px; text-align: center; }
        .title { font-size: 16px; font-weight: bold; color: #4f46e5; border-bottom: 2px solid #edf2f7; padding-bottom: 5px; margin-bottom: 10px; }
        .sub-label { font-size: 13px; font-weight: bold; color: #4a5568; margin-top: 5px; }
        .btn-set { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        button { padding: 8px 12px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 13px; }
        button:hover { background: #e2e8f0; }
        button.active { background: #db2777; color: white; border-color: #db2777; font-weight: bold; }
        .action-btn { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .action-btn:hover { background: #4338ca; }
        .msg { background: #f0fdf4; border-left: 4px solid #22c55e; padding: 10px; font-size: 13px; border-radius: 4px; line-height: 1.4; color: #166534; margin-top: 5px; }
        .color-item { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; margin-right: 15px; margin-bottom: 5px; }
        input[type="color"] { width: 35px; height: 35px; border: 1px solid #cbd5e1; border-radius: 5px; cursor: pointer; background: none; padding: 0; }
    </style>
</head>
<body>

                    <option value="allergy">비염/알레르기 🌿</option>
                    <option value="tired">극심한 피로 상태 😴</option>
                </select>
            </div>
