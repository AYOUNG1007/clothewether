<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 코디룸 - 캐릭터 커스터마이징 v3</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-color: #ffffff;
            --primary-color: #3f51b5;
            --accent-color: #f50057;
            --text-color: #2c3e50;
            --skin-color: #ffdbac;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
            max-width: 1200px;
            width: 100%;
        }

        /* 왼쪽: 컨트롤 및 추천 */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-color);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .card-header {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 20px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 10px;
        }

        /* 입력 폼 */
        .input-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-size: 0.95rem; font-weight: bold; color: #4a5568; }
        select, input[type="number"] {
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        select:focus, input:focus { border-color: var(--primary-color); outline: none; }

        .recommend-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .recommend-btn:hover { background: #303f9f; }
        .recommend-btn:active { transform: translateY(1px); }

        .recommend-box {
            margin-top: 15px;
            padding: 18px;
            background: #e8eaf6;
            border-radius: 10px;
            border-left: 5px solid var(--primary-color);
            line-height: 1.6;
        }
