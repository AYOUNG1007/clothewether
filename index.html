<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐릭터 커스텀 & 옷 입히기</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { display: flex; gap: 20px; max-width: 900px; width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .controls { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .viewer { width: 300px; background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .section { border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .title { font-weight: bold; color: #4f46e5; margin-bottom: 8px; }
        .btn-grid { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .btn { padding: 6px 12px; background: #f3f4f6; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn:hover { background: #e5e7eb; }
        .btn.active { background: #ec4899; color: white; border-color: #ec4899; font-weight: bold; }
        .picker { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        input[type="color"] { width: 35px; height: 35px; border: none; cursor: pointer; background: none; padding: 0; }
        .weather-box { background: #eff6ff; padding: 10px; border-left: 4px solid #3b82f6; font-size: 14px; margin-top: 5px; border-radius: 4px; }
    </style>
</head>
<body>
