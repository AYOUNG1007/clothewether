<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커스텀 웨더 코디룸 - 드레스룸 v2</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-color: #ffffff;
            --primary-color: #5c6bc0;
            --accent-color: #ff7043;
            --text-color: #333;
            
            /* 기본 옷 색상 */
            --default-top: #e0e0e0;
            --default-bottom: #78909c;
            --default-outer: #546e7a;
            --skin-color: #ffdbac;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { margin: 10px 0; font-size: 2rem; color: #333; }
        .subtitle { margin-bottom: 20px; color: #666; text-align: center;}

        .main-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
        }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
        }

        /* 컨트롤 및 드레스룸 섹션 */
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: var(--card-color);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label { font-size: 0.9rem; font-weight: bold; color: #555; }
        select, input[type="number"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .recommend-btn {
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
        }
        .recommend-btn:hover { background: #4a59a7; }

        .recommendation-result {
            margin-top: 10px;
            padding: 15px;
            background: #e8eaf6;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* 드레스룸 아이템 선택 박스 */
        .item-picker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        .item-option {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
        }

        .item-option:hover { border-color: var(--primary-color); background: #f0f2f9;}
        .item-option.active { border-color: var(--accent-color); background: #fff3e0; font-weight: bold;}

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        /* 캐릭터 아바타 섹션 */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .avatar-canvas {
            width: 100%;
            max-width: 300px;
            height: 400px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
        }

        /* SVG 옷 종류 제어용 CSS */
        .clothing-item { display: none; }
        .clothing-item.active { display: block; }
    </style>
</head>
<body>

    <h1>커스텀 웨더 코디룸 👕👒</h1>
    <div class="subtitle">날씨 맞춤 추천을 받거나, 드레스룸에서 나만의 캐릭터를 꾸며보세요!</div>

    <div class="main-container">
        
        <div class="controls-section">
            
            <div class="card">
                <div class="card-title">1. 상태 입력 및 추천</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>계절</label>
                        <select id="weather-season">
                            <option value="spring">봄 🌸</option>
                            <option value="summer">여름 ☀️</option>
                            <option value="autumn">가을 🍁</option>
                            <option value="winter">겨울 ❄️</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>온도 (°C)</label>
                        <input type="number" id="weather-temp" value="18">
                    </div>
                    <div class="form-group">
                        <label>건강 상태</label>
                        <select id="health-status">
                            <option value="good">정상 😀</option>
                            <option value="cold">감기 😷</option>
                            <option value="heat">더위 탐 🥵</option>
                        </select>
                    </div>
                </div>
                <button class="recommend-btn" onclick="applyRecommendation()">날씨 맞춤 추천 입히기 ✨</button>
                <div class="recommendation-result" id="recommend-text">
                    상태를 입력하고 버튼을 누르면 추천 코디가 자동으로 입혀집니다.
                </div>
            </div>

            <div class="card">
                <div class="card-title">2. 드레스룸 (나만의 꾸미기)</div>
                
                <label style="display:block; margin-bottom:8px;">상의 (Top)</label>
                <div class="item-picker-grid" id="top-picker">
                    <div class="item-option active" data-type="top" data-item="tshirt_long" onclick="selectClothing('top', 'tshirt_long')">긴팔티</div>
                    <div class="item-option" data-type="top" data-item="tshirt_short" onclick="selectClothing('top', 'tshirt_short')">반팔티</div>
                    <div class="item-option" data-type="top" data-item="shirt" onclick="selectClothing('top', 'shirt')">셔츠</div>
                    <div class="item-option" data-type="top" data-item="hoodie" onclick="selectClothing('top', 'hoodie')">후드티</div>
                    <div class="item-option" data-type="top" data-item="none" onclick="selectClothing('top', 'none')">맨몸</div>
                </div>
                <div class="color-picker-group">
                    <label>상의 색상</label>
                    <input type="color" id="color-top" value="#e0e0e0" oninput="changeColor('top', this.value)">
                </div>

                <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">

                <label style="display:block; margin-bottom:8px;">하의 (Bottom)</label>
                <div class="item-picker-grid" id="bottom-picker">
                    <div class="item-option active" data-type="bottom" data-item="pants_long" onclick="selectClothing('bottom', 'pants_long')">긴바지</div>
                    <div class="item-option" data-type="bottom" data-item="pants_short" onclick="selectClothing('bottom', 'pants_short')">반바지</div>
                    <div class="item-option" data-type="bottom" data-item="skirt_short" onclick="selectClothing('bottom', 'skirt_short')">미니스커트</div>
                    <div class="item-option" data-type="bottom" data-item="skirt_long" onclick="selectClothing('bottom', 'skirt_long')">롱스커트</div>
                </div>
                <div class="color-picker-group">
                    <label>하의 색상</label>
                    <input type="color" id="color-bottom" value="#78909c" oninput="changeColor('bottom', this.value)">
                </div>

                <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">

                <label style="display:block; margin-bottom:8px;">아우터 (Outer)</label>
                <div class="item-picker-grid" id="outer-picker">
                    <div class="item-option active" data-type="outer" data-item="none" onclick="selectClothing('outer', 'none')">없음</div>
                    <div class="item-option" data-type="outer" data-item="cardigan" onclick="selectClothing('outer', 'cardigan')">가디건</div>
                    <div class="item-option" data-type="outer" data-item="coat" onclick="selectClothing('outer', 'coat')">코트</div>
                    <div class="item-option" data-type="outer" data-item="padding" onclick="selectClothing('outer', 'padding')">패딩</div>
                </div>
                <div class="color-picker-group">
                    <label>아우터 색상</label>
                    <input type="color" id="color-outer" value="#546e7a" oninput="changeColor('outer', this.value)">
                </div>

                <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">

                <label style="display:block; margin-bottom:8px;">액세서리 (Acc)</label>
                <div class="item-picker-grid">
                    <div class="item-option" id="acc-glasses" onclick="toggleAccessory('glasses')">안경</div>
                    <div class="item-option" id="acc-mask" onclick="toggleAccessory('mask')">마스크</div>
                    <div class="item-option" id="acc-muffler" onclick="toggleAccessory('muffler')">목도리</div>
                    <div class="item-option" id="acc-cap" onclick="toggleAccessory('cap')">모자</div>
                </div>
            </div>
        </div>

        <div class="avatar-section">
            <div class="avatar-canvas card">
                <svg viewBox="0 0 200 320" width="100%" height="100%">
                    <g id="body-layer">
                        <rect x="93" y="95" width="14" height="20" fill="#ffdbac" /> <rect x="83" y="210" width="14" height="70" fill="#ffdbac" rx="5"/> <rect x="103" y="210" width="14" height="70" fill="#ffdbac" rx="5"/> <ellipse cx="85" cy="280" rx="12" ry="6" fill="#333" />
                        <ellipse cx="115" cy="280" rx="12" ry="6" fill="#333" />
                    </g>

                    <g id="layer-bottom">
                        <rect class="clothing-item clothing-bottom active" id="item-pants_long" x="80" y="160" width="40" height="70" fill="var(--default-bottom)" rx="2"/>
                        <rect class="clothing-item clothing-bottom" id="item-pants_short" x="80" y="160" width="40" height="35" fill="var(--default-bottom)" rx="2"/>
                        <path class="clothing-item clothing-bottom" id="item-skirt_short" d="M 80 160 L 120 160 L 125 195 L 75 195 Z" fill="var(--default-bottom)" />
                        <path class="clothing-item clothing-bottom" id="item-skirt_long" d="M 80 160 L 120 160 L 130 230 L 70 230 Z" fill="var(--default-bottom)" />
                    </g>

                    <rect x="63" y="115" width="12" height="60" fill="#ffdbac" rx="5"/> <rect x="125" y="115" width="12" height="60" fill="#ffdbac" rx="5"/> <g id="layer-top">
                        <g class="clothing-item clothing-top active" id="item-tshirt_long">
                            <rect x="75" y="115" width="50" height="55" fill="var(--default-top)" rx="3"/>
                            <rect x="63" y="115" width="12" height="55" fill="var(--default-top)" rx="5"/>
                            <rect x="125" y="115" width="12" height="55" fill="var(--default-top)" rx="5"/>
                        </g>
                        <g class="clothing-item clothing-top" id="item-tshirt_short">
                            <rect x="75" y="115" width="50" height="55" fill="var(--default-top)" rx="3"/>
                            <rect x="63" y="115" width="12" height="25" fill="var(--default-top)" rx="5"/>
                            <rect x="125" y="115" width="12" height="25" fill="var(--default-top)" rx="5"/>
                        </g>
                        <g class="clothing-item clothing-top" id="item-shirt">
                            <rect x="75" y="115" width="50" height="55" fill="var(--default-top)" rx="3"/>
                            <rect x="63" y="115" width="12" height="53" fill="var(--default-top)" rx="5"/>
                            <rect x="125" y="115" width="12" height="53" fill="var(--default-top)" rx="5"/>
                            <path d="M 100 115 L 85 125 M 100 115 L 115 125" stroke="#fff" stroke-width="2" fill="none"/>
                            <circle cx="100" cy="130" r="1.5" fill="#fff"/><circle cx="100" cy="140" r="1.5" fill="#fff"/>
                        </g>
                        <g class="clothing-item clothing-top" id="item-hoodie">
                            <rect x="73" y="115" width="54" height="60" fill="var(--default-top)" rx="5"/>
                            <rect x="61" y="115" width="15" height="58" fill="var(--default-top)" rx="7"/>
                            <rect x="124" y="115" width="15" height="58" fill="var(--default-top)" rx="7"/>
                            <ellipse cx="100" cy="115" rx="20" ry="10" fill="var(--default-top)"/> </g>
                    </g>

                    <g id="layer-outer">
                        <g class="clothing-item clothing-outer" id="item-cardigan">
                            <rect x="72" y="115" width="56" height="60" fill="var(--default-outer)" rx="3" opacity="0.9"/>
                            <rect x="60" y="115" width="14" height="58" fill="var(--default-outer)" rx="5" opacity="0.9"/>
                            <rect x="126" y="115" width="14" height="58" fill="var(--default-outer)" rx="5" opacity="0.9"/>
                            <path d="M 100 115 L 100 175" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
                        </g>
                        <g class="clothing-item clothing-outer" id="item-coat">
                            <rect x="70" y="112" width="60" height="95" fill="var(--default-outer)" rx="2"/>
                            <rect x="58" y="115" width="16" height="85" fill="var(--default-outer)" rx="5"/>
                            <rect x="126" y="115" width="16" height="85" fill="var(--default-outer)" rx="5"/>
                            <path d="M 100 112 L 80 130 M 100 112 L 120 130" stroke="#fff" stroke-width="2"/>
                        </g>
                        <g class="clothing-item clothing-outer" id="item-padding">
                            <rect x="68" y="110" width="64" height="100" fill="var(--default-outer)" rx="10"/>
                            <rect x="55" y="115" width="18" height="90" fill="var(--default-outer)" rx="8"/>
                            <rect x="127" y="115" width="18" height="90" fill="var(--default-outer)" rx="8"/>
                            <line x1="70" y1="135" x2="130" y2="135" stroke="#fff" stroke-width="1" opacity="0.3"/>
                            <line x1="70" y1="160" x2="130" y2="160" stroke="#fff" stroke-width="1" opacity="0.3"/>
                            <line x1="70" y1="185" x2="130" y2="185" stroke="#fff" stroke-width="1" opacity="0.3"/>
                        </g>
                    </g>

                    <g id="head-layer">
                        <circle cx="100" cy="70" r="30" fill="#ffdbac" /> <path d="M 70 70 Q 100 35 130 70 Q 100 50 70 70" fill="#4a3728" /> <circle cx="90" cy="70" r="3" fill="#333" /> <circle cx="110" cy="70" r="3" fill="#333" />
                        <path d="M 95 85 Q 100 92 105 85" stroke="#333" stroke-width="2" fill="none" id="face-mouth"/> <g id="acc-item-glasses" class="clothing-item">
                            <circle cx="90" cy="70" r="8" stroke="#333" stroke-width="2" fill="none" />
                            <circle cx="110" cy="70" r="8" stroke="#333" stroke-width="2" fill="none" />
                            <line x1="98" y1="70" x2="102" y2="70" stroke="#333" stroke-width="2" />
                        </g>
                        <path id="acc-item-mask" class="clothing-item" d="M 75 75 Q 100 98 125 75 Z" fill="#fff" stroke="#ccc" />
                        <g id="acc-item-cap" class="clothing-item">
                            <path d="M 70 60 Q 100 30 130 60 Z" fill="#e53935"/>
                            <rect x="110" y="55" width="30" height="8" rx="2" fill="#e53935"/>
                        </g>
                    </g>
                    
                    <path id="acc-item-muffler" class="clothing-item" d="M 85 95 Q 100 115 115 95 Q 125 120 100 130 Q 75 120 85 95 Z" fill="#ff7043" rx="5"/>

                </svg>
            </div>
            <p style="font-size:0.8rem; color:#888;">CSS & SVG로 구현된 아바타입니다.</p>
        </div>
    </div>

    <script>
        // --- 드레스룸 핵심 기능 ---

        // 1. 의상 종류 선택 (상의, 하의, 아우터)
        function selectClothing(type, itemId) {
            // SVG 아이템 표시/숨김
            const allItemsInGroup = document.querySelectorAll(`.clothing-${type}`);
            allItemsInGroup.forEach(item => item.classList.remove('active'));

            if (itemId !== 'none') {
                const selectedItem = document.getElementById(`item-${itemId}`);
                if (selectedItem) selectedItem.classList.add('active');
            }

            // UI 버튼 스타일 변경
            const allOptions = document.querySelectorAll(`.item-option[data-type="${type}"]`);
            allOptions.forEach(opt => opt.classList.remove('active'));
            
            const selectedOption = document.querySelector(`.item-option[data-type="${type}"][data-item="${itemId}"]`);
            if (selectedOption) selectedOption.classList.add('active');

            // 아우터 선택 시 상의와 겹침 처리 로직 (패딩/코트는 상의 색상을 가림)
            if(type === 'outer') {
                const topLayer = document.getElementById('layer-top');
                if(itemId === 'padding' || itemId === 'coat') {
                    topLayer.style.opacity = '0.3'; // 아우터가 두꺼우면 상의 연하게
                } else {
                    topLayer.style.opacity = '1';
                }
            }
        }

        // 2. 색상 변경
        function changeColor(type, color) {
            const layerGroup = document.getElementById(`layer-${type}`);
            // 그룹 내의 모든 rect, path, g 원소의 fill 속성을 변경
            const elements = layerGroup.querySelectorAll('rect, path, ellipse, circle');
            elements.forEach(el => {
                // 셔츠 단추나 후드 끈 같은 흰색 데코레이션은 제외
                if(el.getAttribute('stroke') !== '#fff' && el.getAttribute('fill') !== '#fff') {
                    el.setAttribute('fill', color);
                }
            });
            // 컬러 픽커 값 동기화
            document.getElementById(`color-${type}`).value = color;
        }

        // 3. 액세서리 토글 (On/Off)
        function toggleAccessory(accId) {
            const accItem = document.getElementById(`acc-item-${accId}`);
            const accBtn = document.getElementById(`acc-${accId}`);
            
            if (accItem.classList.contains('active')) {
                accItem.classList.remove('active');
                accBtn.classList.remove('active');
            } else {
                accItem.classList.add('active');
                accBtn.classList.add('active');
            }
        }

        // --- 날씨 맞춤 추천 알고리즘 ---

        function applyRecommendation() {
            const season = document.getElementById('weather-season').value;
            const temp = parseFloat(document.getElementById('weather-temp').value);
            const health = document.getElementById('health-status').value;
            const resultBox = document.getElementById('recommend-text');

            // 기본 초기화 (액세서리 다 끔)
            const accessories = ['glasses', 'mask', 'muffler', 'cap'];
            accessories.forEach(acc => {
                document.getElementById(`acc-item-${acc}`).classList.remove('active');
                document.getElementById(`acc-${acc}`).classList.remove('active');
            });

            let text = "";
            let tColor = "#e0e0e0", bColor = "#78909c", oColor = "#546e7a";

            // 건강 상태에 따른 체감 온도 보정 및 필수 아이템
            let perceptTemp = temp;
            if(health === 'cold') {
                perceptTemp -= 3; // 감기면 더 춥게 느낌
                toggleAccessory('mask'); // 마스크 착용
            } else if(health === 'heat') {
                perceptTemp += 3; // 더위 타면 더 덥게 느낌
            }

            // 온도별 의상 추천 (종류 + 색상 감성)
            if (perceptTemp >= 27) { // 아주 더운 날
                text = "☀️ <b>반팔티에 반바지</b>로 시원하게 입으세요. 캡 모자로 햇빛을 가리는 것도 좋습니다.";
                selectClothing('top', 'tshirt_short');
                selectClothing('bottom', 'pants_short');
                selectClothing('outer', 'none');
                tColor = "#ffffff"; bColor = "#90caf9"; // 흰티에 연청
                toggleAccessory('cap');
            }
            else if (perceptTemp >= 20 && perceptTemp < 27) { // 따뜻한 날
                text = "🌸 <b>셔츠나 반팔티에 가벼운 긴바지/치마</b>를 추천합니다.";
                selectClothing('top', 'shirt');
                selectClothing('bottom', 'pants_long');
                selectClothing('outer', 'none');
                tColor = "#fce4ec"; bColor = "#be9c91"; // 파스텔톤
            }
            else if (perceptTemp >= 10 && perceptTemp < 20) { // 선선한 날 (일교차)
                text = "🍁 <b>긴팔티 위에 가디건</b>을 쳐서 일교차에 대비하세요.";
                selectClothing('top', 'tshirt_long');
                selectClothing('bottom', 'pants_long');
                selectClothing('outer', 'cardigan');
                tColor = "#fff"; bColor = "#37474f"; oColor = "#afb42b"; // 가을느낌 가디건
            }
            else if (perceptTemp >= 5 && perceptTemp < 10) { // 쌀쌀한 날
                text = "🧥 <b>후드티에 코트</b>를 레이어드하고 긴바지를 입으세요.";
                selectClothing('top', 'hoodie');
                selectClothing('bottom', 'pants_long');
                selectClothing('outer', 'coat');
                tColor = "#bdbdbd"; bColor = "#263238"; oColor = "#4e342e"; // 톤다운된 코디
            }
            else { // 추운 날
                text = "❄️ <b>따뜻한 후드티, 기모바지에 패딩</b>은 필수입니다. 목도리도 하세요!";
                selectClothing('top', 'hoodie');
                selectClothing('bottom', 'pants_long');
                selectClothing('outer', 'padding');
                tColor = "#546e7a"; bColor = "#1a237e"; oColor = "#212121";
                toggleAccessory('muffler');
            }

            // 계절 멘트 추가
            if(season === 'winter') text += " 빙판길 조심하세요!";
            if(season === 'summer' && health === 'good') text += " 자외선 차단제를 바르세요.";

            // 화면 반영
            resultBox.innerHTML = text;
            changeColor('top', tColor);
            changeColor('bottom', bColor);
            changeColor('outer', oColor);
        }

        // 초기 실행
        window.onload = function() {
            applyRecommendation(); // 처음에 현재 입력값 기반 추천 코디 입힘
        };

    </script>
</body>
</html>
