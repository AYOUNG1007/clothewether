<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>제페토 스타일 아바타 드레스룸</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .box { display: flex; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); gap: 30px; max-width: 900px; width: 100%; }
        .left-menu { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .right-view { width: 300px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 15px; text-align: center; }
        .title { font-size: 16px; font-weight: bold; color: #4f46e5; border-bottom: 2px solid #edf2f7; padding-bottom: 5px; margin-bottom: 10px; }
        .sub-label { font-size: 13px; font-weight: bold; color: #4a5568; margin-top: 5px; }
        .btn-set { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        button { padding: 8px 12px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 13px; }
        button:hover { background: #e2e8f0; }
        button.active { background: #db2777; color: white; border-color: #db2777; font-weight: bold; }
        .action-btn { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .action-btn:hover { background: #4338ca; }
        .msg { background: #f0fdf4; border-left: 4px solid #22c55e; padding: 10px; font-size: 13px; border-radius: 4px; line-height: 1.4; color: #166534; margin-top: 5px; }
        .color-item { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; margin-right: 15px; margin-bottom: 5px; }
        input[type="color"] { width: 35px; height: 35px; border: 1px solid #cbd5e1; border-radius: 5px; cursor: pointer; background: none; padding: 0; }
    </style>
</head>
<body>

    <div class="box">
        <div class="left-menu">
            
            <div class="title">🌡️ 날씨 & 스마트 컨디션 설정</div>
            <div style="font-size: 14px;">
                기온: <input type="number" id="w-temp" value="12" style="width: 50px; padding: 5px;"> °C 
                &nbsp;&nbsp;컨디션: 
                <select id="w-health" style="padding: 5px;">
                    <option value="good">최상 (건강함) ✨</option>
                    <option value="cold">독감/몸살 기운 😷</option>
                    <option value="allergy">비염/알레르기 🌿</option>
                    <option value="tired">극심한 피로 상태 😴</option>
                </select>
            </div>
            <button class="action-btn" onclick="runZepetoCody()">날씨 맞춤 스마트 코디 실행 ⚡</button>
            <div class="msg" id="cody-msg">버튼을 누르면 날씨와 상태에 맞는 옷과 건강 조언이 매칭됩니다.</div>

            <div class="title" style="margin-top: 10px;">🎨 캐릭터 커스터마이징 (제페토 스타일)</div>
            <div>
                <div class="color-item">🎨 피부톤: <input type="color" id="clr-skin" value="#ffe5d9" oninput="liveSkin(this.value)"></div>
                <div class="color-item">💇 머리색: <input type="color" id="clr-hair" value="#6f4e37" oninput="liveHair(this.value)"></div>
            </div>

            <div class="sub-label">얼굴형 (볼살 비율)</div>
            <div class="btn-set" id="ui-face">
                <button class="active" onclick="liveFace('round')">동글동글 귀여운형</button>
                <button onclick="liveFace('v')">갸름한 V라인형</button>
            </div>

            <div class="sub-label">헤어 스타일</div>
            <div class="btn-set" id="ui-hair">
                <button class="active" onclick="liveHairStyle('wave')">풍성한 웨이브 롱</button>
                <button onclick="liveHairStyle('bob')">귀여운 단발 머리</button>
                <button onclick="liveHairStyle('short')">깔끔한 숏컷 단발</button>
            </div>

            <div class="sub-label">눈 모양 (제페토 큰 눈)</div>
            <div class="btn-set" id="ui-eyes">
                <button class="active" onclick="liveEyes('brown')">러블리 브라운 아이</button>
                <button onclick="liveEyes('blue')">신비로운 블루 아이</button>
                <button onclick="liveEyes('smile')">해맑은 반달 웃음눈</button>
            </div>

            <div class="sub-label">입 모양</div>
            <div class="btn-set" id="ui-mouth">
                <button class="active" onclick="liveMouth('happy')">수줍은 미소</button>
                <button onclick="liveMouth('open')">활짝 열린 웃음</button>
            </div>

            <div class="title" style="margin-top: 10px;">👗 수동 옷 색상 다이어리</div>
            <div>
                <div class="color-item">상의 색상: <input type="color" id="clr-top" value="#85a98f" oninput="liveCloth('top', this.value)"></div>
                <div class="color-item">하의 색상: <input type="color" id="clr-bottom" value="#3d3d3d" oninput="liveCloth('bottom', this.value)"></div>
            </div>

        </div>

        <div class="right-view">
            <svg viewBox="0 0 200 320" width="100%" height="400px" style="background: white; border-radius: 8px;">
                
                <g id="base-body">
                    <path id="node-neck" d="M 94 95 L 94 110 L 106 110 L 106 95 Z" fill="#ffe5d9" />
                    <path id="node-leg-l" d="M 76 210 L 92 210 L 90 285 Q 90 290 82 290 L 74 285 Z" fill="#ffe5d9"/>
                    <path id="node-leg-r" d="M 108 210 L 124 210 L 126 285 L 118 290 Q 110 290 110 285 Z" fill="#ffe5d9"/>
                    <path d="M 71 283 L 91 283 L 91 296 L 71 294 Z" fill="#b45309"/>
                    <path d="M 109 283 L 129 283 L 129 294 L 109 296 Z" fill="#b45309"/>
                </g>

                <g id="node-bare-arms" style="display: none;">
                    <path d="M 68 135 L 58 185 L 68 185 Z" fill="#ffe5d9"/>
                    <path d="M 132 135 L 142 185 L 132 185 Z" fill="#ffe5d9"/>
                </g>

                <g id="node-face-layer">
                    <path id="f-round" d="M 66 70 Q 64 104 100 112 Q 136 104 134 70 A 34 32 0 0 0 66 70 Z" fill="#ffe5d9" style="display: inline;"/>
                    <path id="f-v" d="M 68 70 Q 68 106 100 114 Q 132 106 132 70 A 32 30 0 0 0 68 70 Z" fill="#ffe5d9" style="display: none;"/>
                    <circle cx="78" cy="88" r="7" fill="#f43f5e" opacity="0.25"/>
                    <circle cx="122" cy="88" r="7" fill="#f43f5e" opacity="0.25"/>
                </g>

                <g id="node-features-layer">
                    <g id="e-brown" style="display: inline;">
                        <circle cx="86" cy="74" r="7" fill="#fff"/><circle cx="86" cy="74" r="5.5" fill="#5c4033"/><circle cx="87.5" cy="72" r="2" fill="#fff"/>
                        <circle cx="114" cy="74" r="7" fill="#fff"/><circle cx="114" cy="74" r="5.5" fill="#5c4033"/><circle cx="112.5" cy="72" r="2" fill="#fff"/>
                    </g>
                    <g id="e-blue" style="display: none;">
                        <circle cx="86" cy="74" r="7" fill="#fff"/><circle cx="86" cy="74" r="5.5" fill="#2563eb"/><circle cx="87.5" cy="72" r="2" fill="#fff"/>
                        <circle cx="114" cy="74" r="7" fill="#fff"/><circle cx="114" cy="74" r="5.5" fill="#2563eb"/><circle cx="112.5" cy="72" r="2" fill="#fff"/>
                    </g>
                    <g id="e-smile" style="display: none;">
                        <path d="M 77 75 Q 86 67 95 75" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                        <path d="M 105 75 Q 114 67 123 75" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                    </g>
                    <path d="M 99 78 L 101 83 L 99 86" stroke="#e2a494" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <path id="m-happy" d="M 94 95 Q 100 100 106 95" stroke="#be123c" stroke-width="3" fill="none" stroke-linecap="round" style="display: inline;"/>
                    <path id="m-open" d="M 93 94 Q 100 107 107 94 Z" fill="#fda4af" stroke="#be123c" stroke-width="2" style="display: none;"/>
                </g>

                <g id="node-hair-layer">
                    <g id="h-wave" style="display: inline;">
                        <path d="M 66 70 Q 44 100 48 165 Q 68 150 68 90 Z" fill="#6f4e37" class="hair-color-node"/>
                        <path d="M 134 70 Q 156 100 152 165 Q 132 150 132 90 Z" fill="#6f4e37" class="hair-color-node"/>
                        <path d="M 64 68 Q 100 16 136 68 Q 140 85 130 98 Q 100 45 70 98 Q 60 85 64 68" fill="#6f4e37" class="hair-color-node"/>
                    </g>
                    <path id="h-bob" d="M 64 68 Q 100 18 136 68 Q 142 92 136 104 Q 100 52 64 104 Q 58 92 64 68" fill="#6f4e37" style="display: none;" class="hair-color-node"/>
                    <path id="h-short" d="M 66 62 Q 100 24 134 62 L 137 74 Q 100 44 63 74 Z" fill="#6f4e37" style="display: none;" class="hair-color-node"/>
                </g>

                <g id="node-pants-layer">
                    <path id="c-pants" d="M 72 205 L 128 205 L 125 278 L 111 278 L 100 222 L 89 278 L 75 278 Z" fill="#3d3d3d" style="display: inline;"/>
                    <path id="c-shorts" d="M 72 205 L 128 205 L 125 236 L 102 236 L 100 216 L 98 236 L 75 236 Z" fill="#3d3d3d" style="display: none;"/>
                </g>

                <g id="node-top-layer">
                    <path id="c-long" d="M 68 135 L 52 190 L 62 192 L 73 148 L 73 210 L 127 210 L 127 148 L 138 192 L 148 190 L 132 135 Q 132 112 100 112 Q 68 112 68 135 Z" fill="#85a98f" style="display: inline;"/>
                    <path id="c-short" d="M 68 135 L 57 155 L 68 158 L 73 145 L 73 210 L 127 210 L 127 145 L 132 158 L 143 155 L 132 135 Q 132 112 100 112 Q 68 112 68 135 Z" fill="#85a98f" style="display: none;"/>
                </g>

                <path id="c-coat" d="M 65 130 L 52 195 L 64 197 L 70 150 L 70 240 L 130 240 L 130 150 L 136 197 L 148 195 L 135 130 Q 132 110 100 110 Z" fill="#7c2d12" style="display: none;"/>
                <path id="c-padding" d="M 62 125 L 48 200 L 62 203 L 68 155 L 68 250 L 132 250 L 132 155 L 138 203 L 152 200 L 138 125 Q 132 105 100 105 Z" fill="#1e293b" style="display: none;"/>
                
                <path id="c-mask" d="M 74 78 Q 100 106 126 78 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" style="display: none;"/>

            </svg>
            <div style="font-size: 12px; font-weight: bold; color: #64748b; margin-top: 10px;">제페토 라이브 핏</div>
        </div>
    </div>

    <script>
        // 코드 작동을 보장하기 위한 가장 안전하고 확실한 자바스크립트 설계

        function liveFace(style) {
            document.getElementById('f-round').style.display = (style === 'round') ? 'inline' : 'none';
            document.getElementById('f-v').style.display = (style === 'v') ? 'inline' : 'none';
            syncUI('ui-face', style === 'round' ? 0 : 1);
        }

        function liveHairStyle(style) {
            document.getElementById('h-wave').style.display = (style === 'wave') ? 'inline' : 'none';
            document.getElementById('h-bob').style.display = (style === 'bob') ? 'inline' : 'none';
            document.getElementById('h-short').style.display = (style === 'short') ? 'inline' : 'none';
            syncUI('ui-hair', style === 'wave' ? 0 : (style === 'bob' ? 1 : 2));
        }

        function liveEyes(style) {
            document.getElementById('e-brown').style.display = (style === 'brown') ? 'inline' : 'none';
            document.getElementById('e-blue').style.display = (style === 'blue') ? 'inline' : 'none';
            document.getElementById('e-smile').style.display = (style === 'smile') ? 'inline' : 'none';
            syncUI('ui-eyes', style === 'brown' ? 0 : (style === 'blue' ? 1 : 2));
        }

        function liveMouth(style) {
            document.getElementById('m-happy').style.display = (style === 'happy') ? 'inline' : 'none';
            document.getElementById('m-open').style.display = (style === 'open') ? 'inline' : 'none';
            syncUI('ui-mouth', style === 'happy' ? 0 : 1);
        }

        function liveSkin(color) {
            document.getElementById('clr-skin').value = color;
            document.getElementById('node-neck').setAttribute('fill', color);
            document.getElementById('node-leg-l').setAttribute('fill', color);
            document.getElementById('node-leg-r').setAttribute('fill', color);
            document.getElementById('f-round').setAttribute('fill', color);
            document.getElementById('f-v').setAttribute('fill', color);
            document.getElementById('node-bare-arms').querySelectorAll('path').forEach(p => p.setAttribute('fill', color));
        }

        function liveHair(color) {
            document.getElementById('clr-hair').value = color;
            document.querySelectorAll('.hair-color-node').forEach(el => el.setAttribute('fill', color));
        }

        function liveCloth(part, color) {
            if (part === 'top') {
                document.getElementById('clr-top').value = color;
                document.getElementById('c-long').setAttribute('fill', color);
                document.getElementById('c-short').setAttribute('fill', color);
            } else {
                document.getElementById('clr-bottom').value = color;
                document.getElementById('c-pants').setAttribute('fill', color);
                document.getElementById('c-shorts').setAttribute('fill', color);
            }
        }

        function syncUI(id, idx) {
            const btns = document.getElementById(id).querySelectorAll('button');
            btns.forEach((b, i) => { if(i === idx) b.classList.add('active'); else b.classList.remove('active'); });
        }

        function runZepetoCody() {
            const temp = parseFloat(document.getElementById('w-temp').value);
            const health = document.getElementById('w-health').value;
            const msgBox = document.getElementById('cody-msg');

            // 화면 가시성 초기 리셋 클리어
            document.getElementById('c-long').style.display = 'none';
            document.getElementById('c-short').style.display = 'none';
            document.getElementById('node-bare-arms').style.display = 'none';
            document.getElementById('c-pants').style.display = 'none';
            document.getElementById('c-shorts').style.display = 'none';
            document.getElementById('c-coat').style.display = 'none';
            document.getElementById('c-padding').style.display = 'none';
            document.getElementById('c-mask').style.display = 'none';

            let tClr = "#85a98f"; let bClr = "#3d3d3d";
            let advice = "";

            let cTemp = temp;
            if (health === 'cold') {
                cTemp -= 4;
                document.getElementById('c-mask').style.display = 'inline';
                advice = "<br>😷 <b>[컨디션 팁]</b> 감기 몸살 기운이 감지되어 마스크를 착용했습니다. 추천 영양소: <b>비타민 C</b>";
            } else if (health === 'allergy') {
                document.getElementById('c-mask').style.display = 'inline';
                advice = "<br>🌿 <b>[컨디션 팁]</b> 꽃가루/비염 방지용 마스크를 착용했습니다. 추천 영양소: <b>프로폴리스</b>";
            } else if (health === 'tired') {
                cTemp -= 1.5;
                advice = "<br>😴 <b>[컨디션 팁]</b> 면역 저하 상태입니다. 몸을 조이지 않는 편안한 핏을 권장합니다. 추천 영양소: <b>비타민 B</b>";
            } else {
                advice = "<br>✨ <b>[컨디션 팁]</b> 아주 건강함! 기분 좋은 하루를 보내세요. 추천 영양소: <b>종합 비타민</b>";
            }

            // 기온 경계값 코디 맵핑
            if (cTemp >= 24) {
                msgBox.innerHTML = "☀️ <b>더운 여름 날씨:</b> 시원한 <b>반팔 티셔츠와 반바지</b> 조합으로 자동 추천합니다!" + advice;
                document.getElementById('c-short').style.display = 'inline';
                document.getElementById('node-bare-arms').style.display = 'inline';
                document.getElementById('c-shorts').style.display = 'inline';
                tClr = "#ffffff"; bClr = "#60a5fa";
            } else if (cTemp >= 15 && cTemp < 24) {
                msgBox.innerHTML = "🌸 <b>쾌적한 날씨:</b> 포근하고 베이직한 <b>긴팔 니트티에 슬랙스 바지</b> 조합입니다." + advice;
                document.getElementById('c-long').style.display = 'inline';
                document.getElementById('c-pants').style.display = 'inline';
                tClr = "#85a98f"; bClr = "#3d3d3d";
            } else if (cTemp >= 5 && cTemp < 15) {
                msgBox.innerHTML = "🍁 <b>쌀쌀한 날씨:</b> 일교차가 심합니다. 니트 위에 따뜻한 <b>클래식 롱 코트</b>를 장착했습니다." + advice;
                document.getElementById('c-long').style.display = 'inline';
                document.getElementById('c-pants').style.display = 'inline';
                document.getElementById('c-coat').style.display = 'inline';
                tClr = "#ffffff"; bClr = "#1e293b";
            } else {
                msgBox.innerHTML = "❄️ <b>매서운 한파:</b> 체온 유지 필수! 두꺼운 <b>윈터 다운 롱패딩 외투</b>로 철벽 무장했습니다." + advice;
                document.getElementById('c-long').style.display = 'inline';
                document.getElementById('c-pants').style.display = 'inline';
                document.getElementById('c-padding').style.display = 'inline';
                tClr = "#cbd5e1"; bClr = "#0f172a";
            }

            liveCloth('top', tClr);
            liveCloth('bottom', bClr);
        }

        window.onload = function() {
            liveSkin("#ffe5d9");
            liveHair("#6f4e37");
            runZepetoCody();
        };
    </script>
</body>
</html>
