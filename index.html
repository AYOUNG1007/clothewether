<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 웨더 캐주얼 코디룸</title>
    <style>
        body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background-color: #f5f7fa; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { display: grid; grid-template-columns: 1fr 360px; gap: 20px; max-width: 1150px; width: 100%; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
        
        .panel-left { display: flex; flex-direction: column; gap: 20px; }
        .card { background: white; padding: 22px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .card-title { font-size: 1.15rem; font-weight: bold; color: #4f46e5; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        
        .row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .group { flex: 1; min-width: 120px; display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.9rem; font-weight: bold; color: #475569; }
        select, input[type="number"] { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; }
        select:focus, input:focus { border-color: #4f46e5; }
        
        .btn-blue { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-blue:hover { background: #4338ca; }
        .msg-box { margin-top: 12px; padding: 12px; background: #eff6ff; border-left: 4px solid #3b82f6; font-size: 0.95rem; border-radius: 4px; line-height: 1.5; }
        
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 8px; margin-top: 5px; margin-bottom: 15px; }
        .btn-opt { background: #f8fafc; border: 2px solid #e2e8f0; padding: 9px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 0.85rem; }
        .btn-opt:hover { border-color: #4f46e5; }
        .btn-opt.active { border-color: #ec4899; background: #fff1f2; font-weight: bold; color: #db2777; }
