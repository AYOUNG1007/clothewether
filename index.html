<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제페토 스타일 날씨&건강 코디룸</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f6f9fc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { display: flex; gap: 25px; max-width: 1000px; width: 100%; background: #ffffff; padding: 25px; border-radius: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
        .editor-side { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .view-side { width: 340px; background: #f8fafc; border-radius: 16px; border: 2px solid #e2e8f0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: sticky; top: 20px; }
        
        .section-title { font-size: 1.1rem; font-weight: bold; color: #4f46e5; border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; margin-bottom: 12px; }
        .label-text { font-size: 0.9rem; font-weight: bold; color: #475569; margin-top: 10px; margin-bottom: 4px; }
        
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .custom-btn { padding: 8px 14px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
        .custom-btn:hover { background: #e2e8f0; }
        .custom-btn.active { background: #db2777; color: white; border-color: #db2777; font-weight: bold; }
        
        .picker-group { display: flex; gap: 20px; align-items: center; margin: 10px 0; }
        .picker-box { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; }
        input[type="color"] { width: 40px; height: 40px; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; background: none; padding: 0; }
        
        select, input[type="number"] { padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .submit-btn { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 5px; }
        .submit-btn:hover { background: #4338ca; }
        
        .info-box { background: #f0fdf4; border-left: 4px solid #22c55e; padding: 12px; font-size: 13.5px; border-radius: 4px; line-height: 1.5; color: #166534; }
    </style>
</head>
<body>

    <div class="container">
        <div class="editor-side">
            
            <div class="block">
                <div class="section-title">🌡️ 날씨 & 스마트 건강 설정</div>
                <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 10px;">
                    <div>
                        <span class="label-text">현재 기온:</span>
                        <input type="number" id="weather-temp" value="12" style="width: 50px;"> °C
                    </div>
                    <div>
                        <span class="label-text">건강 컨디션:</span>
                        <select id="health-status">
                            <option value="good">건강함 (최상) ✨</option>
                            <option value="cold">독감/몸살 기운 😷</option>
                            <option value="allergy">비염/알레르기 🌿</option>
