<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 웨더 커스텀 코디룸</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --panel-color: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #ec4899;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: #1f2937;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .app-container {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 25px;
            max-width: 1200px;
            width: 100%;
        }

        @media (max-width: 900px) {
            .app-container { grid-template-columns: 1fr; }
        }

        /* 왼쪽 메뉴 레이아웃 */
        .left-menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--panel-color);
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 폼 요소 */
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label { font-size: 0.9rem; font-weight: bold; color: #4b5563; }
        select, input[type="number"] {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        select:focus, input:focus { border-color: var(--primary); }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-main:hover { background: var(--primary-hover); }

        .recommend-box {
            margin-top: 15px;
            padding: 15px;
            background: #eef2ff;
            border-left: 5px solid var(--primary);
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* 옵션 그리드 */
