<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커스텀 웨더 코디룸 - 드레스룸 v2</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-color: #ffffff;
            --primary-color: #5c6bc0;
            --accent-color: #ff7043;
            --text-color: #333;
            
            /* 기본 옷 색상 */
            --default-top: #e0e0e0;
            --default-bottom: #78909c;
            --default-outer: #546e7a;
            --skin-color: #ffdbac;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { margin: 10px 0; font-size: 2rem; color: #333; }
        .subtitle { margin-bottom: 20px; color: #666; text-align: center;}

        .main-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
        }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
        }

        /* 컨트롤 및 드레스룸 섹션 */
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: var(--card-color);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label { font-size: 0.9rem; font-weight: bold; color: #555; }
        select, input[type="number"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .recommend-btn {
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
        }
        .recommend-btn:hover { background: #4a59a7; }

        .recommendation-result {
            margin-top: 10px;
            padding: 15px;
            background: #e8eaf6;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* 드레스룸 아이템 선택 박스 */
        .item-picker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        .item-option {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
            display
